    addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommand()}if(e.key==='Escape'){const openDate=document.querySelector('.date-pop:not([hidden])');if(openDate){openDate.hidden=true;openDate.closest('.date-field')?.querySelector('.date-trigger')?.setAttribute('aria-expanded','false');return}closeMenu();closeDrawer();closeCommand();closeMobile()}});document.querySelectorAll('.topbar [data-menu]').forEach(b=>b.onclick=()=>openMenu(b,b.dataset.menu));render('overview');
  </script>
